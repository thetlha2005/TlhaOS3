
name: Build TalhaOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debian 13 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools

      - name: Run TalhaOS build script
        run: |
          sudo chmod +x ./build.sh
          sudo ./build.sh

      - name: Prepare ISO and checksum
        run: |
          mkdir -p dist
          ISO_FILE=$(find . -maxdepth 3 -type f -iname "*.iso" -print -quit)

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file was generated"
            exit 1
          fi

          cp "$ISO_FILE" dist/
          cd dist
          sha256sum *.iso > SHA256SUMS.txt

      - name: Upload TalhaOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: TalhaOS-live-amd64
          path: |
            dist/*.iso
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
